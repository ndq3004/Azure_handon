<style>
  :host {
    --sidebar-width: 220px;
    --navbar-height: 60px;
    --primary-bg: var(--bright-blue, #4f46e5);
    --sidebar-bg: var(--gray-900, #18181b);
    --navbar-bg: var(--electric-violet, #7c3aed);
    --content-bg: #f8fafc;
    --menu-hover: var(--vivid-pink, #ec4899);
    --menu-active: var(--hot-red, #ef4444);
    --text-light: #fff;
    --text-dark: #18181b;
    font-family: "Inter", sans-serif;
  }

  body, html {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  .layout {
    display: flex;
    height: 100vh;
    background: var(--content-bg);
  }

  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    color: var(--text-light);
    display: flex;
    flex-direction: column;
    padding-top: var(--navbar-height);
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 10;
    box-shadow: 2px 0 8px rgba(0,0,0,0.04);
  }

  .sidebar .logo {
    font-size: 1.5rem;
    font-weight: bold;
    padding: 1.5rem 1rem 1rem 1.5rem;
    color: var(--vivid-pink);
    letter-spacing: 2px;
  }

  .sidebar nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 0 1rem;
  }

  .sidebar nav a {
    color: var(--text-light);
    text-decoration: none;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: background 0.2s, color 0.2s;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .sidebar nav a:hover {
    background: var(--menu-hover);
    color: var(--text-light);
  }

  .sidebar nav a.active {
    background: var(--menu-active);
    color: var(--text-light);
  }

  .navbar {
    height: var(--navbar-height);
    background: var(--navbar-bg);
    color: var(--text-light);
    display: flex;
    align-items: center;
    padding: 0 2rem;
    position: fixed;
    left: var(--sidebar-width);
    right: 0;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .navbar .menu {
    margin-left: auto;
    display: flex;
    gap: 1.5rem;
  }

  .navbar .menu a {
    color: var(--text-light);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  .navbar .menu a:hover {
    color: var(--menu-hover);
  }

  .main-content {
    margin-left: var(--sidebar-width);
    margin-top: var(--navbar-height);
    padding: 2rem;
    min-height: calc(100vh - var(--navbar-height));
    background: var(--content-bg);
    transition: margin 0.2s;
  }

  @media (max-width: 900px) {
    .sidebar {
      width: 60px;
      padding-top: var(--navbar-height);
    }
    .sidebar .logo {
      font-size: 1rem;
      padding: 1rem 0.5rem;
    }
    .sidebar nav a {
      padding: 0.75rem 0.5rem;
      font-size: 0.95rem;
      justify-content: center;
    }
    .main-content {
      margin-left: 60px;
    }
    .navbar {
      left: 60px;
    }
  }

  @media (max-width: 650px) {
    .sidebar {
      display: none;
    }
    .navbar {
      left: 0;
    }
    .main-content {
      margin-left: 0;
      padding: 1rem;
    }
  }
</style>

<div class="layout">
  <aside *ngIf="showSidebar" class="sidebar">
    <div class="logo">PubSub UI</div>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>🏠</span> Home
      </a>
      <a routerLink="/messages" routerLinkActive="active">
        <span>💬</span> Messages
      </a>
      <a routerLink="/settings" routerLinkActive="active">
        <span>⚙️</span> Settings
      </a>
    </nav>
  </aside>
  <div style="flex:1; display:flex; flex-direction:column;">
    <header class="navbar" [style.left]="!showSidebar ? '0px' : ''">
      <nav class="menu">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/about" routerLinkActive="active">About</a>
        <a routerLink="/help" routerLinkActive="active">Help</a>
      </nav>
    </header>
    <main class="main-content" [style.marginLeft]="!showSidebar ? '0px' : ''">
      <router-outlet />
    </main>
  </div>
</div>
